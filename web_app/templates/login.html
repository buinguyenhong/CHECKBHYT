<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Hệ thống đối soát BHYT BNH</title>
    <script>
        // Set theme immediately to avoid flash of dark/light theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        :root {
            /* Dark Theme Variables (Default) */
            --bg-color: #0b1329;
            --bg-gradient: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.1) 0px, transparent 50%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --input-bg: #0f172a;
            --input-border: rgba(255, 255, 255, 0.1);
            --focus-shadow: rgba(59, 130, 246, 0.2);
            --input-focus-bg: rgba(15, 23, 42, 0.8);
            --btn-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --btn-gradient-hover: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --btn-shadow: rgba(59, 130, 246, 0.3);
            --btn-shadow-hover: rgba(59, 130, 246, 0.4);
            --title-gradient: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            --toggle-bg: rgba(255, 255, 255, 0.05);
            --toggle-border: rgba(255, 255, 255, 0.1);
            --toggle-hover: rgba(255, 255, 255, 0.15);
        }

        html[data-theme="light"] {
            /* Light Theme Variables (Modern Premium Green Accent) */
            --bg-color: #f0fdf4;
            --bg-gradient: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.06) 0px, transparent 50%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(16, 185, 129, 0.15);
            --text-main: #0f172a;
            --text-secondary: #475569;
            --primary: #10b981;
            --primary-hover: #059669;
            --input-bg: #ffffff;
            --input-border: rgba(16, 185, 129, 0.2);
            --focus-shadow: rgba(16, 185, 129, 0.2);
            --input-focus-bg: #ffffff;
            --btn-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --btn-gradient-hover: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            --btn-shadow: rgba(16, 185, 129, 0.2);
            --btn-shadow-hover: rgba(16, 185, 129, 0.3);
            --title-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --toggle-bg: rgba(16, 185, 129, 0.05);
            --toggle-border: rgba(16, 185, 129, 0.15);
            --toggle-hover: rgba(16, 185, 129, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .logo-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-shadow);
            background: var(--input-focus-bg);
        }

        .btn-submit {
            width: 100%;
            background: var(--btn-gradient);
            border: none;
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--btn-shadow);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--btn-shadow-hover);
            background: var(--btn-gradient-hover);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        html[data-theme="light"] .error-message {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #b91c1c;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Floating Theme Toggle Switcher */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            width: 38px;
            height: 38px;
            outline: none;
        }

        .theme-toggle-btn:hover {
            background: var(--toggle-hover);
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .theme-toggle-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Responsive Icons */
        html[data-theme="light"] .sun-icon {
            display: none;
        }
        html[data-theme="light"] .moon-icon {
            display: block;
            color: #475569;
        }
        html:not([data-theme="light"]) .moon-icon {
            display: none;
        }
        html:not([data-theme="light"]) .sun-icon {
            display: block;
            color: #fbbf24;
        }
    </style>
</head>
<body>

<div class="login-container">
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div class="logo-header">
        <h1>CheckBHYT Web</h1>
        <p>Hệ thống mạng LAN đối soát và xử lý lỗi BHYT</p>
    </div>

    <div class="error-message" id="errorMsg">Sai tên đăng nhập hoặc mật khẩu.</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">Đăng Nhập</button>
    </form>

    <div class="footer">
        Phần mềm hỗ trợ nghiệp vụ BHYT — BNH &copy; 2026
    </div>
</div>

<script>
    function toggleTheme() {
        const activeTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = activeTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const formData = new FormData(form);
        
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                // Đăng nhập thành công, chuyển hướng theo role
                const data = await response.json();
                if (data.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/department';
                }
            } else {
                const errData = await response.json();
                errorMsg.innerText = errData.detail || "Đăng nhập thất bại. Vui lòng thử lại.";
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            errorMsg.innerText = "Lỗi kết nối máy chủ LAN. Vui lòng kiểm tra lại.";
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
